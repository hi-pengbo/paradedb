name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read versions from Dockerfile
        id: versions
        run: |
          paradedb="$(grep -E '^ARG PARADEDB_VERSION=' Dockerfile | head -1 | cut -d= -f2 | tr -d '"')"
          vchord="$(grep -E '^ARG VCHORD_VERSION=' Dockerfile | head -1 | cut -d= -f2 | tr -d '"')"
          pg="$(grep -E '^ARG PG_VERSION=' Dockerfile | head -1 | cut -d= -f2 | tr -d '"')"
          echo "paradedb=${paradedb}" >>"$GITHUB_OUTPUT"
          echo "vchord=${vchord}" >>"$GITHUB_OUTPUT"
          echo "pg=${pg}" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=pg${{ steps.versions.outputs.pg }},enable={{is_default_branch}}
            type=raw,value=${{ steps.versions.outputs.paradedb }}-vchord-${{ steps.versions.outputs.vchord }}-pg${{ steps.versions.outputs.pg }}
            type=sha,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=paradedb-vchord
            org.opencontainers.image.description=ParadeDB PostgreSQL image with VectorChord (vchord) preinstalled
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
